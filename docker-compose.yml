services:
  # Database
  db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    networks:
      - wordpress_network

  # WordPress (Apache)
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    ports:
      - "${WP_PORT:-8080}:80"
    restart: always
    volumes:
      - ./src:/var/www/html
      - ./uploads:/var/www/html/wp-content/uploads
      - ./logs/apache:/var/log/apache2
      - ./logs/php:/var/log/php
      # Custom php.ini settings (optional)
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      # Table prefix - update when restoring from a nonstandard database
      WORDPRESS_TABLE_PREFIX: wp_
      # Optional environment variables
      WORDPRESS_DEBUG: ${WP_DEBUG:-false}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('WP_DEBUG_LOG', true);
    networks:
      - wordpress_network

  # phpMyAdmin
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    networks:
      - wordpress_network

  # Alternative: WordPress with PHP-FPM and Nginx
  # Uncomment if preferred over Apache
  # wordpress_fpm:
  #   depends_on:
  #     - db
  #   image: wordpress:php8.1-fpm
  #   volumes:
  #     - ./src:/var/www/html
  #     # Custom php.ini settings (optional)
  #     # - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
  #   restart: always
  #   environment:
  #     WORDPRESS_DB_HOST: db
  #     WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
  #     WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
  #     WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
  #     WORDPRESS_DEBUG: ${WP_DEBUG:-false}
  #   networks:
  #     - wordpress_network

  # nginx:
  #   depends_on:
  #     - wordpress_fpm
  #   image: nginx:latest
  #   ports:
  #     - "${WP_PORT:-8080}:80"
  #   volumes:
  #     - ./src:/var/www/html
  #     - ./docker/nginx/conf.d:/etc/nginx/conf.d
  #   networks:
  #     - wordpress_network

networks:
  wordpress_network:

volumes:
  db_data:
