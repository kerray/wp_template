# WordPress PHP-FPM + Nginx Docker Compose Configuration
#
# Modern, high-performance WordPress development environment with:
# - Nginx web server (faster than Apache)
# - PHP-FPM for PHP processing
# - Bidirectional file sync (edit files from host or container)
# - Optional services via profiles
#
# Usage:
#   Start:     just up                    # or: docker compose up -d
#   Stop:      just down                  # or: docker compose down
#   Logs:      just logs                  # or: docker compose logs -f
#   Rebuild:   just rebuild               # or: docker compose build --no-cache
#
# Optional Services (via profiles):
#   just up phpmyadmin    # Add phpMyAdmin
#   just up adminer       # Add Adminer
#   just up sftp          # Add SFTP access
#   just up all           # Add all optional services
#
# Services:
#   - db: MySQL 5.7 database
#   - wordpress: PHP-FPM with WP-CLI, Composer, MCP plugin
#   - nginx: Web server
#   - phpmyadmin: Database management (optional)
#   - adminer: Lightweight DB management (optional)
#   - sftp: SFTP/SCP access to WordPress files (optional)

services:
  # ==========================================================================
  # Database
  # ==========================================================================
  db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # WordPress PHP-FPM
  # PHP-FPM runs as host user for bidirectional file editing
  # ==========================================================================
  wordpress:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ./docker/wordpress-fpm
      dockerfile: Dockerfile
      args:
        COMPOSER_VERSION: ${COMPOSER_VERSION:-2.7.1}
        WP_CLI_VERSION: ${WP_CLI_VERSION:-2.11.0}
        WP_MCP_VERSION: ${WP_MCP_VERSION:-0.2.3}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: wordpress-fpm-ai-dev:latest
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./uploads:/var/www/html/wp-content/uploads
      - ./logs/php:/var/log/php
      # Custom PHP configuration
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-false}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('WP_DEBUG_LOG', true);
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Nginx Web Server
  # Serves static files and proxies PHP to wordpress container
  # ==========================================================================
  nginx:
    image: nginx:1-alpine
    depends_on:
      - wordpress
    ports:
      - "${WP_PORT:-8080}:80"
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html:ro
      - ./uploads:/var/www/html/wp-content/uploads:ro
      - ./docker/nginx/conf.d/wordpress.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # phpMyAdmin (Optional - use --profile phpmyadmin or --profile all)
  # SECURITY: Bound to localhost only by default - not accessible from network
  # ==========================================================================
  phpmyadmin:
    depends_on:
      db:
        condition: service_healthy
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 for security - only accessible from localhost
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      UPLOAD_LIMIT: 64M
    networks:
      - wordpress_network
    profiles:
      - phpmyadmin
      - all

  # ==========================================================================
  # Adminer (Optional - use --profile adminer or --profile all)
  # Lightweight alternative to phpMyAdmin
  # SECURITY: Bound to localhost only by default - not accessible from network
  # ==========================================================================
  adminer:
    depends_on:
      db:
        condition: service_healthy
    image: adminer:latest
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 for security - only accessible from localhost
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    networks:
      - wordpress_network
    profiles:
      - adminer
      - all

  # ==========================================================================
  # SFTP/SCP Access (Optional - use --profile sftp or --profile all)
  # Provides secure file access to WordPress files
  #
  # Connection: sftp -P ${SFTP_PORT:-2222} wordpress@localhost
  # Default password: wordpress (change SFTP_PASSWORD in .env for production)
  # ==========================================================================
  sftp:
    image: atmoz/sftp:alpine
    restart: unless-stopped
    ports:
      - "${SFTP_PORT:-2222}:22"
    volumes:
      # WordPress files (read-write)
      - ./src:/home/wordpress/html
      - ./uploads:/home/wordpress/uploads
      # Optional: mount SSH keys for key-based auth
      # - ./docker/sftp/keys/id_rsa.pub:/home/wordpress/.ssh/keys/id_rsa.pub:ro
    environment:
      # Format: user:password:uid:gid:directories
      # UID/GID should match host user for proper permissions
      SFTP_USERS: "wordpress:${SFTP_PASSWORD:-wordpress}:${USER_ID:-1000}:${GROUP_ID:-1000}:html,uploads"
    networks:
      - wordpress_network
    profiles:
      - sftp
      - all

networks:
  wordpress_network:
    driver: bridge

volumes:
  db_data:
