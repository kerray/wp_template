# WordPress Nginx Configuration for PHP-FPM
# Optimized for performance and security

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    # Hide nginx version
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Increase max body size for uploads (matches PHP settings)
    client_max_body_size 64M;

    # Health check endpoint for Docker
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # SECURITY: Block sensitive files BEFORE PHP processing
    # These must come before the general PHP handler
    # =========================================================================

    # Block wp-config.php
    location = /wp-config.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block xmlrpc.php (often used in attacks)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block PHP files in uploads directory
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block hidden files (dotfiles)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block debug.log
    location = /wp-content/debug.log {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block readme/license/changelog files
    location ~* ^/(readme|license|changelog)\.(html|txt)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # END SECURITY BLOCKS
    # =========================================================================

    # WordPress permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPM processing (only for files not blocked above)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS off;

        # Timeouts for long-running operations (plugin installs, imports)
        fastcgi_read_timeout 600;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 600;

        # Buffer sizes
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # PHP-FPM status and ping (for health checks)
    location ~ ^/(status|ping)$ {
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker networks
        allow 10.0.0.0/8;     # Docker networks
        deny all;
        fastcgi_pass wordpress:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Allow robots.txt and sitemap
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location ~* sitemap.*\.xml$ {
        allow all;
        log_not_found off;
        access_log off;
    }
}
